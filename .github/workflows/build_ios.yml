name: Build Mobile Apps (iOS IPA & Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd timemaps_app
          flutter pub get

      - name: Build iOS App (Unsigned IPA)
        run: |
          cd timemaps_app
          flutter pub get
          
          # Attempt flutter build ios with no codesigning
          if ! flutter build ios --release --no-codesign; then
            echo "Flutter build ios exited, running direct xcodebuild with unsigned overrides..."
            cd ios
            xcodebuild -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -sdk iphoneos \
              -derivedDataPath ../build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
            cd ..
          fi

          # Locate Runner.app
          APP_DIR=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Runner.app not found under build directory!"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found Runner.app at: $APP_DIR"

          # Package into standard IPA format
          rm -rf Payload TimeMaps.ipa
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -r TimeMaps.ipa Payload
          ls -lh TimeMaps.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeMaps-iOS-IPA
          path: timemaps_app/TimeMaps.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd timemaps_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd timemaps_app
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeMaps-Android-APK
          path: timemaps_app/build/app/outputs/flutter-apk/app-release.apk
